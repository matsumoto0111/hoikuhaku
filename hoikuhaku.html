<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ほいコレアンケート" />
  <title>保育博2027 ほいコレ ブースアンケート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #fff5f7 0%, #fffbeb 50%, #f0f9ff 100%);
    }
    .card-btn {
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease;
    }
    .card-btn:active {
      transform: scale(0.96);
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-48px) scale(1.25); opacity: 0; }
    }
    .plus-one {
      animation: floatUp 0.65s ease-out forwards;
      pointer-events: none;
    }
    .subtle-logo {
      height: 22px;
      max-width: 96px;
      width: auto;
      object-fit: contain;
      opacity: 0.85;
    }
  </style>
</head>
<body class="flex flex-col h-screen text-slate-800">

  <!-- ヘッダー -->
  <header class="flex items-center justify-between px-5 py-3 bg-white/90 backdrop-blur-md border-b border-pink-100 shadow-sm shrink-0">
    <div class="flex items-center gap-3">
      <div class="px-3.5 py-1.5 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-extrabold text-sm tracking-wide shadow-sm">
        ほいコレ
      </div>
      <div>
        <h1 class="text-lg md:text-xl font-extrabold text-slate-800 leading-tight">
          いま、一番気になっているテーマはどれですか？
        </h1>
        <p class="text-xs text-slate-500 font-medium">
          当てはまるものをタップしてください（複数選択OK！）
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2.5">
      <!-- 同期ステータス -->
      <div id="syncBadge" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>リアルタイム同期中</span>
      </div>

      <!-- 総回答数 -->
      <div class="px-3.5 py-1.5 rounded-xl bg-slate-100 border border-slate-200 text-right">
        <span class="text-[10px] font-bold text-slate-500 block leading-none">TOTAL</span>
        <span id="totalCountDisplay" class="text-lg font-extrabold text-slate-800 leading-tight">0</span>
        <span class="text-xs font-bold text-slate-500">票</span>
      </div>

      <!-- 音声ON/OFF -->
      <button id="soundToggleBtn" onclick="toggleSound()" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition" title="効果音切替">
        <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/>
        </svg>
        <svg id="soundOffIcon" class="w-5 h-5 hidden text-slate-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/>
        </svg>
      </button>

      <!-- 管理・集計モーダルボタン -->
      <button onclick="openAdminModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold shadow-sm transition">
        集計・設定
      </button>
    </div>
  </header>

  <!-- メイン6タイルエリア -->
  <main class="flex-1 p-4 md:p-5 grid grid-cols-2 md:grid-cols-3 grid-rows-3 md:grid-rows-2 gap-3.5 md:gap-4 min-h-0">
    <div id="cardsContainer" class="contents"></div>
  </main>

  <!-- フッター -->
  <footer class="px-5 py-2 bg-white/80 border-t border-slate-200/70 flex items-center justify-between text-xs text-slate-500 shrink-0">
    <div class="flex items-center gap-2">
      <span>同期ルーム:</span>
      <code id="roomNameDisplay" class="px-2 py-0.5 rounded bg-slate-100 font-mono font-bold text-slate-700">hoikuhaku2027</code>
    </div>
    <button onclick="undoLastTap()" id="undoBtn" class="px-3 py-1 rounded-lg bg-slate-100 hover:bg-rose-50 hover:text-rose-600 font-bold text-slate-600 transition flex items-center gap-1">
      <span>↩</span>
      <span>直前の1タップを取り消す</span>
    </button>
  </footer>

  <!-- タップ御礼トースト -->
  <div id="thanksToast" class="fixed bottom-14 left-1/2 -translate-x-1/2 px-6 py-2.5 rounded-full bg-slate-900/90 text-white font-bold text-sm shadow-xl opacity-0 pointer-events-none transition-opacity duration-200 z-40">
    ご回答ありがとうございます！
  </div>

  <!-- 集計・管理モーダル -->
  <div id="adminModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h2 class="text-lg font-extrabold text-slate-800">集計結果・ブース運用設定</h2>
        <button onclick="closeAdminModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center font-bold text-slate-600">✕</button>
      </div>

      <!-- 現在の集計一覧 -->
      <div class="mt-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-500">項目別カウント状況</span>
          <div class="flex items-center gap-2">
            <button onclick="exportCSV()" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm transition">
              CSVダウンロード
            </button>
            <button onclick="resetAllCounts()" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-rose-100 hover:text-rose-700 text-slate-600 text-xs font-bold transition">
              すべて0にリセット
            </button>
          </div>
        </div>
        <div id="adminSummaryList" class="space-y-2"></div>
      </div>

      <!-- 同期ルーム変更 -->
      <div class="mt-5 pt-4 border-t border-slate-100">
        <label class="block text-xs font-bold text-slate-600 mb-1">同期ルームID（複数iPadで同じIDにするとリアルタイム同期）</label>
        <div class="flex gap-2">
          <input id="roomInput" type="text" class="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-sm font-mono font-bold" placeholder="hoikuhaku2027" />
          <button onclick="changeRoom()" class="px-4 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">切替</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Realtime Database SDK（オンライン同期用） -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const ITEMS = [
      {
        id: "fair",
        category: "新卒採用系",
        title: "学生と直接会って話したい",
        sub: "就職フェアで母集団を増やしたい・園の魅力を伝えたい",
        logo: "./fair.png",
        icon: "🎪",
        iconBg: "bg-pink-100 text-pink-600",
        border: "border-pink-200 hover:border-pink-400",
        badgeBg: "bg-pink-100 text-pink-700",
        barColor: "bg-pink-500",
        accentText: "text-pink-600"
      },
      {
        id: "navi",
        category: "新卒採用系",
        title: "求人サイトで応募を増やしたい",
        sub: "Web媒体で見学やエントリーを集めたい",
        logo: "./navi.png",
        icon: "💻",
        iconBg: "bg-rose-100 text-rose-600",
        border: "border-rose-200 hover:border-rose-400",
        badgeBg: "bg-rose-100 text-rose-700",
        barColor: "bg-rose-500",
        accentText: "text-rose-600"
      },
      {
        id: "trend",
        category: "新卒採用系",
        title: "最新の採用動向を知りたい",
        sub: "いまの保育学生の動きや他園の採用トレンドを情報収集したい",
        logo: "./hoikore.png",
        icon: "📊",
        iconBg: "bg-amber-100 text-amber-600",
        border: "border-amber-200 hover:border-amber-400",
        badgeBg: "bg-amber-100 text-amber-800",
        barColor: "bg-amber-500",
        accentText: "text-amber-600"
      },
      {
        id: "enkatsu",
        category: "園児募集系",
        title: "園児募集・定員充足を強化したい",
        sub: "地域の保護者に選ばれる園づくり・入園希望者を増やしたい",
        logo: "./enkatsu.png",
        icon: "🏫",
        iconBg: "bg-emerald-100 text-emerald-600",
        border: "border-emerald-200 hover:border-emerald-400",
        badgeBg: "bg-emerald-100 text-emerald-700",
        barColor: "bg-emerald-500",
        accentText: "text-emerald-600"
      },
      {
        id: "hp",
        category: "クリエイティブ領域",
        title: "HP制作・リニューアルしたい",
        sub: "新卒採用や園児募集に強いホームページを作りたい",
        logo: "./enpure.png",
        icon: "🖥️",
        iconBg: "bg-sky-100 text-sky-600",
        border: "border-sky-200 hover:border-sky-400",
        badgeBg: "bg-sky-100 text-sky-700",
        barColor: "bg-sky-500",
        accentText: "text-sky-600"
      },
      {
        id: "movie",
        category: "クリエイティブ領域",
        title: "PR動画・SNSで発信したい",
        sub: "園の雰囲気や保育の様子を動画で分かりやすく伝えたい",
        logo: null,
        icon: "🎬",
        iconBg: "bg-indigo-100 text-indigo-600",
        border: "border-indigo-200 hover:border-indigo-400",
        badgeBg: "bg-indigo-100 text-indigo-700",
        barColor: "bg-indigo-500",
        accentText: "text-indigo-600"
      }
    ];

    let counts = { fair: 0, navi: 0, trend: 0, enkatsu: 0, hp: 0, movie: 0 };
    let tapHistory = [];
    let soundEnabled = true;
    let roomId = new URLSearchParams(window.location.search).get("room") || localStorage.getItem("hoikore_room") || "hoikuhaku2027";
    let db = null;
    let isOnlineSynced = false;

    document.getElementById("roomNameDisplay").textContent = roomId;
    document.getElementById("roomInput").value = roomId;

    const savedLocal = localStorage.getItem("hoikore_counts_" + roomId);
    if (savedLocal) {
      try { counts = { ...counts, ...JSON.parse(savedLocal) }; } catch (e) {}
    }

    function initSync() {
      try {
        const firebaseConfig = {
          databaseURL: "https://hoikore-booth-demo-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        const roomRef = ref(db, "rooms/" + roomId + "/counts");

        onValue(roomRef, (snapshot) => {
          const val = snapshot.val();
          if (val) {
            counts = { fair: 0, navi: 0, trend: 0, enkatsu: 0, hp: 0, movie: 0, ...val };
            localStorage.setItem("hoikore_counts_" + roomId, JSON.stringify(counts));
            renderCards();
            renderAdminSummary();
          } else {
            set(roomRef, counts);
          }
          isOnlineSynced = true;
          updateSyncBadge(true);
        }, () => {
          isOnlineSynced = false;
          updateSyncBadge(false);
        });
      } catch (e) {
        updateSyncBadge(false);
      }
    }

    function updateSyncBadge(online) {
      const badge = document.getElementById("syncBadge");
      if (!badge) return;
      if (online) {
        badge.className = "hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>全端末同期中</span>`;
      } else {
        badge.className = "hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-50 border border-amber-200 text-amber-700 text-xs font-bold";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>端末内保存モード</span>`;
      }
    }

    function playPopSound() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    window.toggleSound = function () {
      soundEnabled = !soundEnabled;
      document.getElementById("soundOnIcon").classList.toggle("hidden", !soundEnabled);
      document.getElementById("soundOffIcon").classList.toggle("hidden", soundEnabled);
    };

    window.handleCardTap = function (itemId) {
      playPopSound();

      counts[itemId] = (counts[itemId] || 0) + 1;
      tapHistory.push({ itemId, time: new Date().toISOString() });
      localStorage.setItem("hoikore_counts_" + roomId, JSON.stringify(counts));

      if (db && isOnlineSynced) {
        const itemRef = ref(db, `rooms/${roomId}/counts/${itemId}`);
        runTransaction(itemRef, (curr) => (curr || 0) + 1);
      }

      renderCards();
      showTapFeedback(itemId);
    };

    function showTapFeedback(itemId) {
      const card = document.getElementById("card-" + itemId);
      if (card) {
        const plus = document.createElement("div");
        plus.textContent = "+1";
        plus.className = "plus-one absolute bottom-12 right-5 text-2xl font-extrabold text-pink-500 drop-shadow-sm";
        card.appendChild(plus);
        setTimeout(() => plus.remove(), 700);
      }
      const toast = document.getElementById("thanksToast");
      toast.style.opacity = "1";
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { toast.style.opacity = "0"; }, 1100);
    }

    window.undoLastTap = function () {
      if (tapHistory.length === 0) return;
      const last = tapHistory.pop();
      if (counts[last.itemId] > 0) {
        counts[last.itemId] -= 1;
        localStorage.setItem("hoikore_counts_" + roomId, JSON.stringify(counts));
        if (db && isOnlineSynced) {
          const itemRef = ref(db, `rooms/${roomId}/counts/${last.itemId}`);
          runTransaction(itemRef, (curr) => Math.max(0, (curr || 0) - 1));
        }
        renderCards();
      }
    };

    function getRanks() {
      const sorted = [...ITEMS]
        .map(it => ({ id: it.id, count: counts[it.id] || 0 }))
        .filter(x => x.count > 0)
        .sort((a, b) => b.count - a.count);

      const rankMap = {};
      sorted.forEach((item, idx) => {
        if (idx > 0 && item.count === sorted[idx - 1].count) {
          rankMap[item.id] = rankMap[sorted[idx - 1].id];
        } else {
          rankMap[item.id] = idx + 1;
        }
      });
      return rankMap;
    }

    function renderCards() {
      const container = document.getElementById("cardsContainer");
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      document.getElementById("totalCountDisplay").textContent = total;
      const ranks = getRanks();

      container.innerHTML = ITEMS.map((item) => {
        const count = counts[item.id] || 0;
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
        const rank = ranks[item.id];

        let rankBadge = "";
        if (rank === 1) {
          rankBadge = `<span class="px-2 py-0.5 rounded-full bg-amber-400 text-amber-950 text-[11px] font-extrabold shadow-sm shrink-0">👑 1位</span>`;
        } else if (rank === 2) {
          rankBadge = `<span class="px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 text-[11px] font-extrabold shrink-0">2位</span>`;
        } else if (rank === 3) {
          rankBadge = `<span class="px-2 py-0.5 rounded-full bg-orange-100 text-orange-800 text-[11px] font-extrabold shrink-0">3位</span>`;
        }

        // 右上にさりげなく添えるサービスロゴ（画像がない項目・読み込み失敗時は非表示）
        const subtleLogoHtml = item.logo
          ? `<img src="${item.logo}" alt="" class="subtle-logo" onerror="this.style.display='none';" />`
          : ``;

        return `
          <button
            id="card-${item.id}"
            onclick="handleCardTap('${item.id}')"
            class="card-btn relative bg-white rounded-3xl p-4 md:p-5 border-2 ${item.border} shadow-sm hover:shadow-md flex flex-col justify-between text-left overflow-hidden h-full"
          >
            <!-- 上部：カテゴリ（左）＆ 順位＋さりげないロゴ（右） -->
            <div class="w-full flex items-center justify-between gap-2 min-h-[26px]">
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold ${item.badgeBg} shrink-0">
                ${item.category}
              </span>
              <div class="flex items-center gap-2 justify-end">
                ${rankBadge}
                ${subtleLogoHtml}
              </div>
            </div>

            <!-- 中央：親しみやすいアイコン＋お悩み・テーマ見出し -->
            <div class="my-auto py-1.5 flex items-start gap-3.5">
              <div class="w-12 h-12 md:w-14 md:h-14 rounded-2xl ${item.iconBg} flex items-center justify-center text-2xl md:text-3xl shrink-0 mt-0.5">
                ${item.icon}
              </div>
              <div class="min-w-0">
                <h2 class="text-base md:text-xl font-extrabold text-slate-800 leading-snug">
                  ${item.title}
                </h2>
                <p class="text-xs md:text-sm text-slate-500 font-medium mt-1 line-clamp-2">
                  ${item.sub}
                </p>
              </div>
            </div>

            <!-- 下部：リアルタイム票数・割合バー -->
            <div class="w-full pt-2 border-t border-slate-100">
              <div class="flex items-baseline justify-between mb-1">
                <span class="text-xs font-bold text-slate-400">タップして投票</span>
                <div>
                  <span class="text-xl md:text-2xl font-extrabold ${item.accentText}">${count}</span>
                  <span class="text-xs font-bold text-slate-500">票 (${pct}%)</span>
                </div>
              </div>
              <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full ${item.barColor} transition-all duration-300" style="width: ${pct}%"></div>
              </div>
            </div>
          </button>
        `;
      }).join("");
    }

    window.openAdminModal = function () {
      renderAdminSummary();
      document.getElementById("adminModal").classList.remove("hidden");
      document.getElementById("adminModal").classList.add("flex");
    };

    window.closeAdminModal = function () {
      document.getElementById("adminModal").classList.add("hidden");
      document.getElementById("adminModal").classList.remove("flex");
    };

    function renderAdminSummary() {
      const el = document.getElementById("adminSummaryList");
      if (!el) return;
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      el.innerHTML = ITEMS.map(it => {
        const c = counts[it.id] || 0;
        const pct = total > 0 ? ((c / total) * 100).toFixed(1) : "0.0";
        return `
          <div class="flex items-center justify-between px-3 py-2.5 rounded-xl bg-slate-50 text-xs">
            <span class="font-bold text-slate-700">${it.title}</span>
            <span class="font-extrabold text-slate-900">${c} 票 <span class="text-slate-400 font-normal">(${pct}%)</span></span>
          </div>
        `;
      }).join("");
    }

    window.resetAllCounts = function () {
      if (!confirm("すべてのカウントを0にリセットしますか？")) return;
      ITEMS.forEach(it => { counts[it.id] = 0; });
      tapHistory = [];
      localStorage.setItem("hoikore_counts_" + roomId, JSON.stringify(counts));
      if (db && isOnlineSynced) {
        set(ref(db, "rooms/" + roomId + "/counts"), counts);
      }
      renderCards();
      renderAdminSummary();
      closeAdminModal();
    };

    window.changeRoom = function () {
      const nextRoom = document.getElementById("roomInput").value.trim();
      if (!nextRoom) return;
      localStorage.setItem("hoikore_room", nextRoom);
      window.location.search = "?room=" + encodeURIComponent(nextRoom);
    };

    window.exportCSV = function () {
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      const rows = [["カテゴリ", "項目名", "票数", "構成比(%)"]];
      ITEMS.forEach(it => {
        const c = counts[it.id] || 0;
        const pct = total > 0 ? ((c / total) * 100).toFixed(1) : "0.0";
        rows.push([it.category, it.title, c, pct]);
      });
      const csvContent = "\uFEFF" + rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `hoikore_booth_${roomId}_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };

    renderCards();
